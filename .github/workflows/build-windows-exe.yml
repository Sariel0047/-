name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Prepare Windows browser driver
        shell: pwsh
        run: |
          $metadataUrl = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          $metadata = Invoke-RestMethod -Uri $metadataUrl
          $driver = $metadata.channels.Stable.downloads.chromedriver |
            Where-Object { $_.platform -eq "win64" } |
            Select-Object -First 1
          if (-not $driver) {
            throw "Could not find Stable win64 chromedriver from Chrome for Testing metadata."
          }
          New-Item -ItemType Directory -Force qianiu_auto_report\drivers | Out-Null
          Invoke-WebRequest -Uri $driver.url -OutFile chromedriver-win64.zip
          Expand-Archive chromedriver-win64.zip -DestinationPath chromedriver-win64 -Force
          Copy-Item chromedriver-win64\chromedriver-win64\chromedriver.exe qianiu_auto_report\drivers\chromedriver.exe -Force
          Write-Host "Bundled ChromeDriver URL: $($driver.url)"
          qianiu_auto_report\drivers\chromedriver.exe --version

      - name: Run tests
        run: |
          python -m pytest -q tests/test_data_process.py tests/test_excel_writer.py tests/test_utils.py

      - name: Build EXE
        shell: pwsh
        run: |
          $seleniumManager = python -c "from selenium.webdriver.common.selenium_manager import SeleniumManager; print(SeleniumManager()._get_binary())"
          Write-Host "Selenium Manager: $seleniumManager"
          pyinstaller --onefile --noconsole --name qianiu_auto_report `
            --add-data "qianiu_auto_report\templates;qianiu_auto_report\templates" `
            --add-data "qianiu_auto_report\drivers;qianiu_auto_report\drivers" `
            --add-binary "$seleniumManager;selenium\webdriver\common\windows" `
            main.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\qianiu_auto_report | Out-Null
          Copy-Item dist\qianiu_auto_report.exe release\qianiu_auto_report\
          Copy-Item qianiu_auto_report\templates release\qianiu_auto_report\templates -Recurse -Force
          Copy-Item qianiu_auto_report\drivers release\qianiu_auto_report\drivers -Recurse -Force
          @"
          使用说明
          1. 双击 qianiu_auto_report.exe 启动。
          2. 电脑需要已安装 Google Chrome。
          3. 点击“开始生成”后，在打开的工作浏览器中登录淘宝/抖音。
          4. 回到程序点击“我已登录，开始生成报表”。
          5. 报表默认生成到桌面。
          "@ | Out-File -FilePath release\qianiu_auto_report\使用说明.txt -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: qianiu-auto-report-windows
          path: release/qianiu_auto_report
